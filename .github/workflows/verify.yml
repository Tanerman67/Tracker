name: Verify My Rhythm
on:
  push:
    branches: [main, 'work/**']
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Use official Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PYMIRROR'
          from pathlib import Path
          for source in Path('/etc/apt').rglob('*'):
              if source.is_file() and source.suffix in ('.list', '.sources'):
                  text = source.read_text()
                  updated = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != text:
                      source.write_text(updated)
          PYMIRROR
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 14

